[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "claude-trading-agent"
version = "0.1.0"
description = "Multi-asset trading agent for stocks, crypto, and ETFs"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26.0",
  "pandas>=2.2.0",
  "yfinance>=0.2.40",
  "click>=8.1.7",
  "python-dotenv>=1.0.1",
]

[tool.setuptools]
packages = ["trading_agent"]
